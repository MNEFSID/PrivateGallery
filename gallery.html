<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0f172a;
color:white;
}

header{

position:sticky;
top:0;
z-index:100;

background:#1e293b;
padding:15px;

box-shadow:0 5px 15px rgba(0,0,0,.3);

}

h2{
margin-bottom:12px;
}

#search{

width:100%;
padding:13px;

border:none;
outline:none;

background:#0f172a;
color:white;

border-radius:14px;

}

.gallery{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:8px;

padding:10px;

}

.photo{

aspect-ratio:1/1;

border-radius:14px;

overflow:hidden;

background:#1e293b;

cursor:pointer;

position:relative;

}

.photo img{

width:100%;
height:100%;
object-fit:cover;

transition:.25s;

}

.photo:hover img{

transform:scale(1.05);

}

.fab{

position:fixed;

right:20px;
bottom:20px;

width:62px;
height:62px;

border-radius:50%;

background:#3b82f6;

display:flex;
justify-content:center;
align-items:center;

font-size:36px;

cursor:pointer;

box-shadow:0 10px 25px rgba(0,0,0,.4);

}

#file{

display:none;

}

.viewer{

display:none;

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

background:rgba(0,0,0,.95);

z-index:999;

justify-content:center;
align-items:center;
flex-direction:column;

padding:15px;

}

.viewer img{

max-width:100%;
max-height:70%;

border-radius:15px;

}

.buttons{

display:flex;

gap:15px;

margin-top:20px;

}

.buttons button{

padding:12px 18px;

border:none;

border-radius:12px;

cursor:pointer;

color:white;

font-size:15px;

}

.download{

background:#22c55e;

}

.delete{

background:#ef4444;

}

.close{

margin-top:18px;

color:white;

font-size:18px;

cursor:pointer;

}

.empty{

padding:40px;

text-align:center;

color:#94a3b8;

}

</style>

</head>

<body>

<header>

<h2>📷 Private Gallery</h2>

<input
id="search"
type="text"
placeholder="Cari foto..."
oninput="filterGallery()">

</header>

<div id="gallery" class="gallery"></div>

<div id="empty" class="empty">

Belum ada foto

</div>

<label class="fab">

+

<input id="file"
type="file"
accept="image/*"
multiple>

</label>

<div id="viewer" class="viewer">

<img id="preview">

<div class="buttons">

<button class="download"
onclick="downloadPhoto()">

⬇ Download

</button>

<button class="delete"
onclick="deletePhoto()">

🗑 Hapus

</button>

</div>

<div class="close"
onclick="closeViewer()">

Tutup

</div>

</div>

<script>

if(localStorage.getItem("login")!="true"){
location.href="index.html";
}

const gallery=document.getElementById("gallery");

const empty=document.getElementById("empty");

const file=document.getElementById("file");

let photos=[];

let selected=-1;

function render(){

gallery.innerHTML="";

if(photos.length==0){

empty.style.display="block";

return;

}

empty.style.display="none";

photos.forEach((p,i)=>{

let div=document.createElement("div");

div.className="photo";

div.innerHTML="<img src='"+p.url+"'>";

div.onclick=()=>openViewer(i);

gallery.appendChild(div);

});

}

file.onchange=e=>{

Array.from(e.target.files).forEach(f=>{

let reader=new FileReader();

reader.onload=x=>{

photos.unshift({

name:f.name,

url:x.target.result

});

render();

}

reader.readAsDataURL(f);

});

};

function openViewer(i){

selected=i;

document.getElementById("viewer").style.display="flex";

document.getElementById("preview").src=photos[i].url;

}

function closeViewer(){

document.getElementById("viewer").style.display="none";

}

function downloadPhoto(){

let a=document.createElement("a");

a.href=photos[selected].url;

a.download=photos[selected].name;

a.click();

}

function deletePhoto(){

if(confirm("Hapus foto ini?")){

photos.splice(selected,1);

closeViewer();

render();

}

}

function filterGallery(){

let text=document.getElementById("search").value.toLowerCase();

let items=document.querySelectorAll(".photo");

photos.forEach((p,i)=>{

items[i].style.display=p.name.toLowerCase().includes(text)

? "block"

: "none";

});

}

render();

</script>

</body>
</html>
